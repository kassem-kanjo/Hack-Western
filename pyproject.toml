[project]
name = "darkfleet"
version = "0.1.0"
description = "Dark Fleet: find ships that went dark."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
edge = [
    "onnxruntime",
    "opencv-python-headless",
]
desktop = [
    "pywebview>=5.3",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
